name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Angular site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: CyberpunkTcgVault.Web/package-lock.json

      - name: Install Angular dependencies
        working-directory: CyberpunkTcgVault.Web
        run: npm ci

      - name: Build Angular for GitHub Pages
        working-directory: CyberpunkTcgVault.Web
        run: npm run build -- --configuration production --base-href /CyberpunkTcgVault/

      - name: Add Angular route fallback
        run: >
          cp
          CyberpunkTcgVault.Web/dist/cyberpunk-tcg-vault-web/browser/index.html
          CyberpunkTcgVault.Web/dist/cyberpunk-tcg-vault-web/browser/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: CyberpunkTcgVault.Web/dist/cyberpunk-tcg-vault-web/browser

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4